name: gold-signal

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "force status report"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python signal.py
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          FORCE_REPORT: ${{ github.event.inputs.force }}

      - name: save state
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add last_signal.txt signal_log.csv news_cache.json dxy_cache.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "update state"
          git pull --rebase origin main
          git push
